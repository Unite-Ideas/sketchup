<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Outliner Reforged: a nested tree with the top node lifted out -->
  <g stroke="#3355e6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- tree connectors -->
    <path d="M5 6.5 V17 H8" />
    <path d="M9 11.5 H12" fill="none" opacity="0.9"/>
    <path d="M5 11.5 H8" />
  </g>
  <g fill="#3355e6">
    <!-- root node -->
    <rect x="3.2" y="4.6" width="4.2" height="4.2" rx="1"/>
  </g>
  <g fill="none" stroke="#3355e6" stroke-width="1.6" stroke-linejoin="round">
    <!-- nested nodes -->
    <rect x="8.2" y="9.6" width="3.6" height="3.6" rx="0.9"/>
    <rect x="7.2" y="15.4" width="3.6" height="3.6" rx="0.9"/>
  </g>
  <!-- the "move to top" node, lifted to the corner with an arrow -->
  <g>
    <rect x="15.4" y="3.4" width="5.2" height="5.2" rx="1.2" fill="#d9902b"/>
    <path d="M13.6 14 C16 14 16.5 9.6 18 8.2" stroke="#d9902b" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="0.2 2.6"/>
    <path d="M16.6 8.9 L18 7.6 L19.2 9.1" stroke="#d9902b" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
