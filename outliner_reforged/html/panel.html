<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outliner Reforged</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="toolbar">
    <div class="search-row">
      <input id="search" type="search" placeholder="Search names…" autocomplete="off" spellcheck="false">
      <button id="filter-btn" title="Filters" aria-label="Filters">⌄</button>
    </div>

    <div id="filters" class="filters hidden">
      <label>Type
        <select id="f-type">
          <option value="any">Any</option>
          <option value="group">Group</option>
          <option value="component">Component</option>
          <option value="image">Image</option>
          <option value="section">Section</option>
          <option value="dimension">Dimension</option>
          <option value="text">Text</option>
          <option value="guide">Guide</option>
        </select>
      </label>
      <label>Tag
        <select id="f-tag"><option value="any">Any</option></select>
      </label>
      <label class="chk"><input type="checkbox" id="f-locked"> Locked</label>
      <label class="chk"><input type="checkbox" id="f-hidden"> Hidden</label>
      <label class="chk"><input type="checkbox" id="f-nomat"> No material</label>
    </div>

    <div class="opts-row">
      <label class="opt">Color
        <select id="scheme"></select>
      </label>
      <button id="scheme-edit" class="mini-btn" title="Edit color rules">✎</button>
      <label class="opt">Sort
        <select id="sort">
          <option value="model">Model</option>
          <option value="name">Name</option>
          <option value="type">Type</option>
          <option value="count">Count</option>
        </select>
      </label>
      <label class="opt chk"><input type="checkbox" id="showall"> Show all</label>
      <label class="opt">Font
        <select id="uifont">
          <option value="nexa">Nexa</option>
          <option value="nexabook">Nexa Book</option>
          <option value="source">Source Sans</option>
          <option value="system">System</option>
        </select>
      </label>
    </div>
  </div>

  <div id="tree" tabindex="0" role="tree" aria-label="Model outline"></div>
  <div id="empty" class="empty hidden">Nothing to show.</div>
  <div id="statusbar"></div>

  <ul id="ctxmenu" class="ctxmenu hidden" role="menu"></ul>

  <!-- Color-rule editor -->
  <div id="rules-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <span>Color Rules</span>
        <button class="x" id="rules-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div id="rules-list"></div>
        <button id="rules-add" class="btn">+ Add rule</button>
      </div>
      <div class="modal-foot">
        <span class="hint">First match wins. Unmatched rows keep the default color.</span>
        <button id="rules-save" class="btn primary">Save &amp; apply</button>
      </div>
    </div>
  </div>

  <!-- Batch rename -->
  <div id="batch-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <span id="batch-title">Batch Rename</span>
        <button class="x" id="batch-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <label class="field">Pattern
          <input id="batch-pattern" value="Part #" spellcheck="false">
        </label>
        <label class="field">Start number
          <input id="batch-start" type="number" value="1" min="0">
        </label>
        <div class="hint">Use <code>#</code> where the incrementing number should go.</div>
      </div>
      <div class="modal-foot">
        <span class="hint" id="batch-preview"></span>
        <button id="batch-apply" class="btn primary">Rename</button>
      </div>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
